# Spring Boot가 로그와 운영 정보에서 사용할 애플리케이션 이름이다.
spring.application.name=step-tune-server

# 로컬 기본값은 compose.yaml의 MySQL 접속 정보와 일치한다.
# 배포 환경에서는 DB_URL/DB_USERNAME/DB_PASSWORD 환경변수로 안전하게 덮어쓴다.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/step_tune?serverTimezone=UTC&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:step_tune}
spring.datasource.password=${DB_PASSWORD:step_tune_local_password}

# MySQL에 UUID 전용 타입이 없으므로 Java UUID를 읽기 쉬운 CHAR(36)으로 통일한다.
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=CHAR
# 서버나 DB가 실행되는 지역과 관계없이 모든 DB 시각을 UTC 기준으로 저장한다.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Hibernate는 엔티티와 DB 구조가 맞는지만 검사하고 테이블을 임의로 변경하지 않는다.
# 실제 DB 구조 변경은 아래 Flyway 마이그레이션 파일로만 관리한다.
spring.jpa.hibernate.ddl-auto=validate

# Controller 응답이 끝난 뒤 지연 로딩으로 DB를 조회하는 실수를 방지한다.
spring.jpa.open-in-view=false

# 서버 시작 시 아직 적용되지 않은 V1, V2... SQL을 순서대로 실행한다.
spring.flyway.enabled=true

# Android 요청에서 google/GOOGLE/Google처럼 enum 대소문자가 달라도 같은 값으로 받는다.
spring.jackson.mapper.accept-case-insensitive-enums=true

# 인증 비밀값은 코드에 직접 쓰지 않고 IntelliJ 실행 설정 또는 OS 환경변수에서 읽는다.
# 콜론 뒤 기본값이 비어 있으므로 필수 설정이 없으면 서버 시작 검증에서 실패한다.
app.auth.google-client-id=${GOOGLE_WEB_CLIENT_ID:}
# Kakao/Naver는 설정한 제공자만 사용할 수 있고, 미설정 제공자 요청은 503을 반환한다.
app.auth.kakao-app-id=${KAKAO_APP_ID:}
app.auth.naver-client-id=${NAVER_CLIENT_ID:}
app.auth.naver-client-secret=${NAVER_CLIENT_SECRET:}
# Step Tune 자체 JWT 서명 키이며 최소 32문자가 필요하다.
app.auth.jwt-secret=${JWT_SECRET:}
# JWT를 누가 발급했고 어떤 앱에서 쓸 토큰인지 검사하는 값이다.
app.auth.jwt-issuer=https://step-tune.local
app.auth.jwt-audience=step-tune-android
# Access Token은 일반 API용 15분, Refresh Token은 자동 로그인용 30일이다.
app.auth.access-token-ttl=15m
app.auth.refresh-token-ttl=30d

# 처리되지 않은 예외의 내부 메시지가 응답에 자동 노출되지 않게 한다.
server.error.include-message=never
