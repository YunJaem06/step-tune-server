# Gradle Wrapper가 내려받은 Gradle 실행 파일을 사용자 Gradle 캐시에 저장한다.
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# 팀과 CI가 같은 Gradle 9.5.1 바이너리를 사용하게 버전을 고정한다.
distributionUrl=https\://services.gradle.org/distributions/gradle-9.5.1-bin.zip
# 다운로드가 무한정 멈추지 않도록 네트워크 제한 시간을 밀리초로 지정한다.
networkTimeout=10000
# 실패를 숨기지 않고 즉시 보여 주도록 Wrapper 자체 재시도는 하지 않는다.
retries=0
retryBackOffMs=500
# 변조되거나 잘못된 배포 주소를 받지 않도록 URL 형식을 검증한다.
validateDistributionUrl=true
# 다운로드한 zip도 사용자 Gradle 캐시 아래에 보관해 다음 빌드에서 재사용한다.
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
