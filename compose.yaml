# Step Tune 서버가 로컬 개발에서 사용할 MySQL 한 개만 실행한다.
services:
  mysql:
    # latest 대신 버전을 고정해 예기치 않은 메이저 버전 변경을 방지한다.
    image: mysql:8.4
    container_name: step-tune-mysql
    restart: unless-stopped

    # 아래 값은 로컬 개발 전용이며 application.properties의 기본 연결값과 일치한다.
    # 운영 환경의 실제 비밀번호는 이 파일에 넣지 않고 배포 서비스의 비밀 환경변수로 관리한다.
    environment:
      MYSQL_DATABASE: step_tune
      MYSQL_USER: step_tune
      MYSQL_PASSWORD: step_tune_local_password
      MYSQL_ROOT_PASSWORD: step_tune_local_root_password

    # PC의 3306 포트를 컨테이너 MySQL의 3306 포트에 연결한다.
    # 따라서 PC에서 실행하는 Spring 서버는 localhost:3306으로 DB에 접속한다.
    ports:
      - "3306:3306"

    # 컨테이너를 다시 만들더라도 DB 데이터를 Docker named volume에 보존한다.
    volumes:
      - step_tune_mysql_data:/var/lib/mysql

    # 한글 닉네임과 이모지까지 저장할 수 있도록 DB 기본 문자셋을 utf8mb4로 고정한다.
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci

    # MySQL이 실제 연결을 받을 준비가 됐는지 Docker가 주기적으로 확인한다.
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

# docker compose down을 해도 유지되는 로컬 DB 저장 공간이다.
# docker compose down -v를 실행할 때만 이 데이터까지 삭제된다.
volumes:
  step_tune_mysql_data:
